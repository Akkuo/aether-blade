<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER BLADE — 聖樹傳說</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage-shell">
      <div id="canvas-wrap">
        <canvas id="game" width="960" height="600"></canvas>
      </div>
      <footer id="controls-bar">
        <span class="badge" id="area-pill">OVERWORLD 聖樹平原</span>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑↓←→</kbd> 移動</span>
        <span><kbd>Space</kbd> / <kbd>Z</kbd> 揮劍（長按迴旋斬・滿血劍氣）</span>
        <span><kbd>E</kbd> / <kbd>X</kbd> 使用道具</span>
        <span><kbd>Q</kbd> 切換道具（炸彈/迴力鏢/聖火法杖）</span>
        <span><kbd>Shift</kbd> 翻滾閃避</span>
        <span><kbd>G</kbd> Bloom</span>
        <span><kbd>M</kbd> 靜音</span>
        <span><kbd>R</kbd> 重來</span>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
